apiVersion: apps/v1
kind: Deployment
metadata:
  name: viajajunto-api
  namespace: viajajunto
  labels:
    app.kubernetes.io/name: viajajunto-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: viajajunto-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: viajajunto-api
      annotations:
        # Set by infra/deploy.sh: a config change rolls the pods.
        viajajunto/config-hash: __CONFIG_HASH__
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api
          image: __API_IMAGE__
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: viajajunto-api
            - configMapRef:
                name: viajajunto-storage
            - secretRef:
                name: viajajunto-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Never touches the database, so a DB hiccup does not restart every pod.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
