AWSTemplateFormatVersion: '2010-09-09'
Description: T2 – ECR + EKS (Grupo 5)

Resources:
  AppRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: t2-app
      ImageScanningConfiguration:
        ScanOnPush: true

  EksRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole

  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: t2-cluster
      RoleArn: !GetAtt EksRole.Arn
      ResourcesVpcConfig:
        SubnetIds: [subnet-1]  # VPC simulada

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref Cluster
      NodeRole: !GetAtt EksRole.Arn   # simplificação; na AWS real os nós têm role própria
      Subnets: [subnet-1]
      ScalingConfig:
        DesiredSize: 1
        MinSize: 1
        MaxSize: 2

Outputs:
  RepositoryUri:
    Value: !GetAtt AppRepository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
