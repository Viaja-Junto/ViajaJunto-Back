# metrics-server is an add-on, as on EKS: without it this shows `cpu: <unknown>`.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: viajajunto-api
  namespace: viajajunto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: viajajunto-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
