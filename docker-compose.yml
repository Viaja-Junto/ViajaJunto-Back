name: viajajunto

services:
  postgres:
    image: postgres:17-alpine
    container_name: viajajunto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-viajajunto}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Postgres accepts connections before it finishes starting up, and that is
      # exactly when `prisma migrate` fails. Everything else waits on this.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-viajajunto}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: applies pending migrations and exits. Built from the `build`
  # stage because the runtime image has no Prisma CLI.
  migrate:
    build:
      context: .
      target: build
    image: viajajunto-migrate:local
    container_name: viajajunto-migrate
    restart: "no"
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-viajajunto}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    image: ${API_IMAGE:-viajajunto-api:local}
    container_name: viajajunto-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-viajajunto}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  adminer:
    image: adminer:5
    container_name: viajajunto-adminer
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Emulated AWS (CloudFormation, ECR, EKS, RDS) for infra/deploy.sh.
  ministack:
    image: ministackorg/ministack:latest
    container_name: viajajunto-ministack
    profiles: [aws]
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    environment:
      MINISTACK_REGION: us-east-1
      # EKS (k3s) and RDS start real containers through the Docker socket and
      # join this network, so the pods reach the RDS endpoint by its address,
      # as they would inside a VPC on AWS.
      DOCKER_NETWORK: viajajunto_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
