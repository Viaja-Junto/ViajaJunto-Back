# Plan B (DB_MODE=cluster): PostgreSQL inside the cluster instead of RDS.
# Outside k8s/ so that `kubectl apply -f k8s/` never applies it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viajajunto-postgres
  namespace: viajajunto
spec:
  replicas: 1
  selector:
    matchLabels: { app: viajajunto-postgres }
  template:
    metadata:
      labels: { app: viajajunto-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: viajajunto
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: viajajunto-local # local demo only
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "viajajunto"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: viajajunto-postgres
  namespace: viajajunto
spec:
  selector:
    app: viajajunto-postgres
  ports:
    - port: 5432
