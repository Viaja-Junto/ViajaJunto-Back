# Plano B (DB_MODE=cluster): Postgres dentro do próprio cluster.
# Fica fora de k8s/ para não ser aplicado pelo "kubectl apply -f k8s/".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t2-postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: t2-postgres }
  template:
    metadata:
      labels: { app: t2-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: t2
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres123 # apenas para a demo local
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "t2"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: t2-postgres
spec:
  selector:
    app: t2-postgres
  ports:
    - port: 5432
