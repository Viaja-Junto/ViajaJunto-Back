apiVersion: apps/v1
kind: Deployment
metadata:
  name: viajajunto-api
  namespace: viajajunto
  labels:
    app.kubernetes.io/name: viajajunto-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: viajajunto-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A new pod must be ready before an old one goes away: no downtime.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: viajajunto-api
      annotations:
        # Hash of the ConfigMap and the Secret, set by infra/deploy.sh: a
        # configuration change rolls the pods, which only read it on start.
        viajajunto/config-hash: __CONFIG_HASH__
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        # `node` user of the node:alpine image.
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api
          # Replaced with the image just pushed to ECR by infra/deploy.sh.
          image: __API_IMAGE__
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: viajajunto-api
            - configMapRef:
                name: viajajunto-storage
            - secretRef:
                name: viajajunto-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The process is up and listening; never touches the database, so a
          # database hiccup does not restart every pod in a loop.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # The pod only receives traffic while it can reach the database.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
